<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crystal Ball</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0d0d12 0%, #1a1a25 100%);
            font-family: sans-serif;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">Загрузка...</div>

    <script type="module">
        import * as THREE from 'three';

        // === СЦЕНА ===
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0d12, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 4, 6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        // === ОСВЕЩЕНИЕ ===
        const ambientLight = new THREE.AmbientLight(0xffaa66, 0.5);
        scene.add(ambientLight);

        const candleLights = [];
        const candleData = [
            { x: -5, y: 3, z: -5, color: 0xffaa44, intensity: 120 },
            { x: 5, y: 2.5, z: -6, color: 0xffcc66, intensity: 100 },
            { x: 0, y: 4, z: -7, color: 0xffdd88, intensity: 80 },
            { x: -3, y: 2, z: -4, color: 0xff9944, intensity: 90 },
            { x: 4, y: 3.5, z: -5, color: 0xffbb55, intensity: 110 }
        ];

        candleData.forEach((data, i) => {
            const light = new THREE.PointLight(data.color, data.intensity, 20);
            light.position.set(data.x, data.y, data.z);
            scene.add(light);
            candleLights.push({
                light,
                baseIntensity: data.intensity,
                flickerSpeed: 0.002 + Math.random() * 0.003,
                offset: i * 1.5
            });
        });

        const mainLight = new THREE.PointLight(0xffffff, 80, 15);
        mainLight.position.set(4, 6, 6);
        scene.add(mainLight);

        const fillLight = new THREE.PointLight(0x88aaff, 30, 12);
        fillLight.position.set(-4, 4, 4);
        scene.add(fillLight);

        // === ТЕКСТУРЫ ===

        function createBokehTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
            grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.6)');
            grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        }

        function createCloudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(128, 128, 0, 128, 128, 120);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(128, 128, 100, 0, Math.PI * 2);
            ctx.fill();
            
            for(let i=0; i<5; i++) {
                const x = 128 + (Math.random() - 0.5) * 150;
                const y = 128 + (Math.random() - 0.5) * 150;
                const r = 30 + Math.random() * 40;
                const g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
                g.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            
            return new THREE.CanvasTexture(canvas);
        }

        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.1, 'rgba(255, 255, 220, 0.95)');
            grad.addColorStop(0.2, 'rgba(255, 240, 180, 0.8)');
            grad.addColorStop(0.35, 'rgba(255, 200, 120, 0.5)');
            grad.addColorStop(0.6, 'rgba(255, 150, 80, 0.2)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = 'rgba(255, 255, 230, 0.5)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(64, 64);
                ctx.lineTo(64 + Math.cos(angle) * 55, 64 + Math.sin(angle) * 55);
                ctx.stroke();
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createDustTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
            grad.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
            grad.addColorStop(0.5, 'rgba(255, 255, 240, 0.4)');
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(32, 32, 30, 0, Math.PI * 2);
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        function createEngravingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2a35';
            ctx.fillRect(0, 0, 512, 256);
            ctx.strokeStyle = '#4a4a5a';
            ctx.lineWidth = 2;
            const patternWidth = 64;
            const patternHeight = 64;
            for (let row = 0; row < 4; row++) {
                for (let col = 0; col < 8; col++) {
                    const x = col * patternWidth + patternWidth / 2;
                    const y = row * patternHeight + patternHeight / 2;
                    ctx.beginPath();
                    ctx.moveTo(x, y - 20);
                    ctx.lineTo(x + 15, y);
                    ctx.lineTo(x, y + 20);
                    ctx.lineTo(x - 15, y);
                    ctx.closePath();
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(x, y, 8, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            ctx.strokeStyle = '#5a5a6a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let i = 0; i <= 512; i += 5) {
                const y = 15 + Math.sin(i * 0.05) * 5;
                if (i === 0) ctx.moveTo(i, y); else ctx.lineTo(i, y);
            }
            ctx.stroke();
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const bokehTex = createBokehTexture();
        const cloudTex = createCloudTexture();
        const starTex = createStarTexture();
        const dustTex = createDustTexture();
        const engravingTexture = createEngravingTexture();

        // === ФОНОВЫЕ БОКЕ ===
        const bgBokehGroup = new THREE.Group();
        const bokehColors = [0x4488ff, 0xff4444, 0xffaa00, 0xaa44ff, 0x00ffff, 0xff00aa, 0x44ff88, 0xff8844];
        
        for (let i = 0; i < 70; i++) {
            const color = bokehColors[Math.floor(Math.random() * bokehColors.length)];
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: bokehTex,
                color: color,
                transparent: true,
                opacity: 0.4 + Math.random() * 0.4,
                blending: THREE.AdditiveBlending,
                depthTest: false
            }));
            
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 18 + Math.random() * 12;
            
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta) + 2;
            const z = radius * Math.cos(phi) - 5;
            
            sprite.position.set(x, y, z);
            
            const scale = 2.5 + Math.random() * 4 + (radius / 10);
            sprite.scale.set(scale, scale, 1);
            
            sprite.userData = { 
                baseScale: scale, 
                baseX: x,
                baseY: y,
                baseZ: z,
                flickerSpeed: 0.001 + Math.random() * 0.002,
                offset: Math.random() * 10,
                theta: theta,
                phi: phi,
                radius: radius
            };
            bgBokehGroup.add(sprite);
        }
        scene.add(bgBokehGroup);

        // === ПРИЗРАЧНЫЕ ОБЛАКА ===
        const cloudGroup = new THREE.Group();
        const cloudMat = new THREE.SpriteMaterial({
            map: cloudTex,
            color: 0xffffff,
            transparent: true,
            opacity: 0.12,
            blending: THREE.NormalBlending,
            depthTest: false
        });

        const clouds = [];
        for (let i = 0; i < 5; i++) {
            const cloud = new THREE.Sprite(cloudMat.clone());
            const scale = 5 + Math.random() * 4;
            cloud.scale.set(scale, scale, 1);
            
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const radius = 14 + Math.random() * 6;
            
            cloud.position.set(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.sin(phi) * Math.sin(theta) + 3,
                radius * Math.cos(phi) - 5
            );
            
            cloud.userData = {
                baseX: cloud.position.x,
                baseY: cloud.position.y,
                baseZ: cloud.position.z,
                speed: 0.0003 + Math.random() * 0.0005,
                offset: Math.random() * 100,
                theta: theta,
                phi: phi,
                radius: radius
            };
            
            scene.add(cloud);
            clouds.push(cloud);
        }

        // === ПОДСТАВКА ===
        const baseGroup = new THREE.Group();
        const baseRadius = 1.0;

        const baseMat = new THREE.MeshStandardMaterial({
            color: 0x2a2a35,
            metalness: 0.7,
            roughness: 0.3,
            emissive: 0x1a1a25,
            emissiveIntensity: 0.1,
            map: engravingTexture,
            bumpMap: engravingTexture,
            bumpScale: 0.02
        });

        const bronzeMat = new THREE.MeshStandardMaterial({
            color: 0x8b6f47,
            metalness: 0.85,
            roughness: 0.25,
            emissive: 0x3a2a1a,
            emissiveIntensity: 0.15,
            map: engravingTexture,
            bumpMap: engravingTexture,
            bumpScale: 0.015
        });

        const baseTopGeom = new THREE.CylinderGeometry(0.35, 0.5, 0.12, 64);
        const baseTop = new THREE.Mesh(baseTopGeom, bronzeMat);
        baseTop.position.y = -baseRadius - 0.06;
        baseGroup.add(baseTop);

        const baseMiddleGeom = new THREE.CylinderGeometry(0.5, 0.7, 0.2, 64);
        const baseMiddle = new THREE.Mesh(baseMiddleGeom, bronzeMat);
        baseMiddle.position.y = -baseRadius - 0.06 - 0.16;
        baseGroup.add(baseMiddle);

        const baseBottomGeom = new THREE.CylinderGeometry(0.7, 0.85, 0.18, 64);
        const baseBottom = new THREE.Mesh(baseBottomGeom, baseMat);
        baseBottom.position.y = -baseRadius - 0.06 - 0.16 - 0.17;
        baseGroup.add(baseBottom);

        for (let i = 0; i < 2; i++) {
            const ringGeom = new THREE.TorusGeometry(0.55 - i * 0.12, 0.015, 16, 64);
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0x9b7f57,
                metalness: 0.9,
                roughness: 0.2,
                emissive: 0x4a3a2a,
                emissiveIntensity: 0.2
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -baseRadius - 0.08 - i * 0.06;
            baseGroup.add(ring);
        }

        const bandMat = new THREE.MeshStandardMaterial({
            color: 0x6b5f47,
            metalness: 0.8,
            roughness: 0.3,
            emissive: 0x2a2a1a,
            emissiveIntensity: 0.1
        });

        const band1Geom = new THREE.TorusGeometry(0.42, 0.008, 16, 64);
        const band1 = new THREE.Mesh(band1Geom, bandMat);
        band1.rotation.x = Math.PI / 2;
        band1.position.y = -baseRadius - 0.12;
        baseGroup.add(band1);

        const band2Geom = new THREE.TorusGeometry(0.62, 0.008, 16, 64);
        const band2 = new THREE.Mesh(band2Geom, bandMat);
        band2.rotation.x = Math.PI / 2;
        band2.position.y = -baseRadius - 0.22;
        baseGroup.add(band2);

        scene.add(baseGroup);

        // === ХРУСТАЛЬНЫЙ ШАР ===
        const ballGroup = new THREE.Group();

        const sphereGeom = new THREE.SphereGeometry(baseRadius, 64, 64);
        const sphereMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 0.05,
            roughness: 0.02,
            transparent: true,
            opacity: 0.12,
            envMapIntensity: 2.5,
            side: THREE.DoubleSide,
            depthWrite: false,
            depthTest: true
        });

        const crystalBall = new THREE.Mesh(sphereGeom, sphereMat);
        ballGroup.add(crystalBall);

        // === ВНУТРЕННИЕ ЗВЁЗДЫ ===
        const innerStars = new THREE.Group();
        const starMat = new THREE.SpriteMaterial({
            map: starTex,
            color: 0xffffee,
            transparent: true,
            alphaTest: 0.02,
            depthWrite: false,
            depthTest: true,
            blending: THREE.AdditiveBlending
        });

        const starPositions = [
            { x: 0.35, y: 0.45, z: 0.25, scale: 0.42 },
            { x: -0.45, y: -0.25, z: 0.35, scale: 0.38 },
            { x: 0.15, y: -0.55, z: -0.35, scale: 0.48 },
            { x: -0.25, y: 0.35, z: -0.45, scale: 0.35 },
            { x: 0.55, y: 0.15, z: -0.25, scale: 0.4 }
        ];

        starPositions.forEach((pos, i) => {
            const star = new THREE.Sprite(starMat);
            star.position.set(pos.x * 0.85, pos.y * 0.85, pos.z * 0.85);
            star.scale.set(pos.scale, pos.scale, 1);
            star.userData = { baseScale: pos.scale, offset: i * 0.9, twinkleSpeed: 0.002 + Math.random() * 0.002 };
            innerStars.add(star);
        });

        crystalBall.add(innerStars);

        // === ИСКРЫ ===
        const sparkles = new THREE.Group();
        const sparkleMat = new THREE.PointsMaterial({
            color: 0xffffee,
            size: 0.025,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const sparkleGeom = new THREE.BufferGeometry();
        const sparkleCount = 150;
        const sparklePositions = new Float32Array(sparkleCount * 3);
        const sparkleSizes = new Float32Array(sparkleCount);

        for (let i = 0; i < sparkleCount; i++) {
            const i3 = i * 3;
            const r = 0.3 + 0.65 * Math.cbrt(Math.random());
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            sparklePositions[i3] = r * Math.sin(phi) * Math.cos(theta);
            sparklePositions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            sparklePositions[i3 + 2] = r * Math.cos(phi);
            sparkleSizes[i] = 0.5 + Math.random() * 0.5;
        }

        sparkleGeom.setAttribute('position', new THREE.BufferAttribute(sparklePositions, 3));
        sparkleGeom.setAttribute('size', new THREE.BufferAttribute(sparkleSizes, 1));
        const sparkleSystem = new THREE.Points(sparkleGeom, sparkleMat);
        sparkles.add(sparkleSystem);
        crystalBall.add(sparkles);

        ballGroup.add(crystalBall);
        scene.add(ballGroup);

        // === ПЫЛИНКИ ===
        // 🔧 УВЕЛИЧЕНО ДО 100 ПЫЛИНОК
        const dustParticles = [];
        const dustMat = new THREE.SpriteMaterial({
            map: dustTex,
            color: 0xffffee,
            transparent: true,
            opacity: 0.25,
            sizeAttenuation: true,
            depthTest: false,
            blending: THREE.AdditiveBlending
        });

        // 🔧 100 пылинок вместо 30
        for (let i = 0; i < 100; i++) {
            const dust = new THREE.Sprite(dustMat.clone());
            // 🔧 Увеличен размер в 2 раза (было 0.025, стало 0.05)
            dust.scale.set(0.05, 0.05, 1);
            dust.position.set(
                (Math.random() - 0.5) * 16,
                (Math.random() - 0.5) * 12,
                (Math.random() - 0.5) * 10
            );
            scene.add(dust);

            dust.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.01,
                    (Math.random() - 0.5) * 0.006,
                    (Math.random() - 0.5) * 0.005
                ),
                baseOpacity: 0.12 + Math.random() * 0.15,
                offset: i * 1.2
            };
            dustParticles.push(dust);
        }

        // === УПРАВЛЕНИЕ ===
        let isZoomed = false;
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let prev = { x: 0, y: 0 };
        let rotVel = { x: 0.001, y: 0.002 };
        const damping = 0.96;
        const sens = 0.005;

        function toggleZoom() {
            isZoomed = !isZoomed;
            const targetScale = isZoomed ? 2.0 : 1.0;
            const startScale = ballGroup.scale.x;
            const startBaseY = baseGroup.position.y;
            const targetBaseY = -(targetScale - 1) * baseRadius;
            
            const duration = 350;
            const startTime = performance.now();

            function animateZoom() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);

                const currentScale = startScale + (targetScale - startScale) * ease;
                ballGroup.scale.set(currentScale, currentScale, currentScale);

                const currentBaseY = startBaseY + (targetBaseY - startBaseY) * ease;
                baseGroup.position.y = currentBaseY;

                if (progress < 1) {
                    requestAnimationFrame(animateZoom);
                }
            }
            animateZoom();
        }

        const onStart = (e) => {
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            dragStart = { x: cx, y: cy };
            prev = { x: cx, y: cy };
            isDragging = true;
        };

        const onMove = (e) => {
            if (!isDragging) return;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = cx - prev.x;
            const dy = cy - prev.y;
            ballGroup.rotation.y += dx * sens;
            ballGroup.rotation.x += dy * sens;
            innerStars.rotation.y += dx * sens;
            innerStars.rotation.x += dy * sens;
            sparkles.rotation.y += dx * sens;
            sparkles.rotation.x += dy * sens;
            rotVel.x = dy * sens;
            rotVel.y = dx * sens;
            prev = { x: cx, y: cy };
        };

        const onEnd = (e) => {
            isDragging = false;
            const cx = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const cy = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const dx = Math.abs(cx - dragStart.x);
            const dy = Math.abs(cy - dragStart.y);
            if (dx < 8 && dy < 8) toggleZoom();
        };

        document.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchstart', onStart, { passive: false });
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);

        // === АНИМАЦИЯ ===
        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;

            candleLights.forEach((candle, i) => {
                candle.light.intensity = candle.baseIntensity +
                    Math.sin(time * 8 + candle.offset) * 15 +
                    Math.sin(time * 12 + candle.offset * 1.3) * 10;
            });

            bgBokehGroup.children.forEach((sprite, i) => {
                sprite.material.opacity = 0.5 + Math.sin(time * 2 + sprite.userData.offset) * 0.3;
                const scale = sprite.userData.baseScale + Math.sin(time * 1.5 + i) * 0.08;
                sprite.scale.set(scale, scale, 1);
            });

            clouds.forEach((cloud, i) => {
                cloud.userData.theta += cloud.userData.speed * 0.5;
                
                cloud.position.x = cloud.userData.radius * Math.sin(cloud.userData.phi) * Math.cos(cloud.userData.theta);
                cloud.position.y = cloud.userData.radius * Math.sin(cloud.userData.phi) * Math.sin(cloud.userData.theta) + 3;
                cloud.position.z = cloud.userData.radius * Math.cos(cloud.userData.phi) - 5;
                
                cloud.material.opacity = 0.1 + Math.sin(time * 0.3 + i) * 0.05;
            });

            if (!isDragging) {
                ballGroup.rotation.y += rotVel.y;
                ballGroup.rotation.x += rotVel.x;
                innerStars.rotation.y += rotVel.y;
                innerStars.rotation.x += rotVel.x;
                sparkles.rotation.y += rotVel.y;
                sparkles.rotation.x += rotVel.x;
                rotVel.x *= damping;
                rotVel.y *= damping;
                if (Math.abs(rotVel.x) < 0.0001 && Math.abs(rotVel.y) < 0.0001) {
                    ballGroup.rotation.y += 0.0002;
                    innerStars.rotation.y += 0.0002;
                    sparkles.rotation.y += 0.0002;
                }
            }

            innerStars.children.forEach((star, i) => {
                const twinkle = Math.sin(time * 1 + star.userData.offset) * 0.2;
                const scale = star.userData.baseScale + twinkle;
                star.scale.set(scale, scale, 1);
                star.material.opacity = 0.75 + Math.sin(time * 1.33 + i) * 0.2;
            });

            sparkleMat.opacity = 0.7 + Math.sin(time * 1.67) * 0.2;

            // 🔧 Анимация 100 пылинок
            dustParticles.forEach((dust, i) => {
                dust.position.add(dust.userData.velocity);
                if (Math.abs(dust.position.x) > 11) dust.userData.velocity.x *= -1;
                if (Math.abs(dust.position.y) > 8) dust.userData.velocity.y *= -1;
                if (Math.abs(dust.position.z) > 7) dust.userData.velocity.z *= -1;
                dust.material.opacity = dust.userData.baseOpacity + Math.sin(time * 2 + dust.userData.offset) * 0.08;
            });

            if (!isDragging) {
                const bobAmplitude = 0.015;
                ballGroup.position.y = Math.sin(time * 0.4) * bobAmplitude;
            }

            renderer.render(scene, camera);
        }

        document.getElementById('loading').style.display = 'none';
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
